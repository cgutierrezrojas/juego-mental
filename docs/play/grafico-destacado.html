<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{font-family:Nunito,system-ui,sans-serif;background:linear-gradient(135deg,#0b0f2a 0%,#1d2366 60%,#3a1c5c 100%);color:#fff;display:flex;align-items:center;gap:56px;padding:0 72px;box-sizing:border-box;position:relative}
.icono{width:220px;height:220px;flex:none;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}

p{font-size:34px;margin:14px 0 26px;font-weight:800;color:#7df9ff}
.fichas{display:flex;gap:14px;font-size:46px}
.fichas span{background:rgba(255,255,255,.1);border-radius:18px;padding:6px 12px}
.brillo{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35}
</style></head><body>

<svg class="icono" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#121212"/><rect x="14" y="14" width="34" height="34" rx="6" fill="#e74c3c"/><rect x="52" y="14" width="34" height="34" rx="6" fill="#3498db"/><rect x="14" y="52" width="34" height="34" rx="6" fill="#27ae60"/><rect x="52" y="52" width="34" height="34" rx="6" fill="#f1c40f"/></svg>

</body></html>
