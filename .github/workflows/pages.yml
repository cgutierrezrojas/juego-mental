# Publica la app en GitHub Pages con solo sus archivos: sin pruebas, documentos de diseño ni reglas de Firebase.
name: Publicar en GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copiar solo los archivos de la app
        run: |
          node copiar-app.mjs _site
          touch _site/.nojekyll
          ls -R _site | head -50
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
