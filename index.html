<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juego Mental</title>
  <script>
    // Pone el tema antes de pintar, para que no parpadee el equivocado:
    // el guardado con el botón ☀️/🌙 o, si no hay, el del sistema.
    try { var tema = localStorage.getItem('ajuste:tema'); } catch (e) {}
    document.documentElement.dataset.tema = tema || (matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro');
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png"> <!-- iPhone: Safari no usa el SVG -->
  <meta name="theme-color" content="#fff7ec">
</head>
<body>
  <main>
    <!-- Barra fija en todas las pantallas: ✕ (solo jugando) a la izquierda, ajustes a la derecha -->
    <header id="barra">
      <button id="btn-salir" aria-label="Salir al menú" hidden>✕</button>
      <div id="esquina">
        <button id="btn-sonido" aria-label="Sonido"></button>
        <button id="btn-vibracion" aria-label="Vibración">📳</button>
        <button id="btn-tema" aria-label="Cambiar tema"></button>
      </div>
    </header>

    <section id="menu">
      <h1>Juego Mental</h1>
      <div id="entreno"></div>
      <div id="lista-juegos"></div>
    </section>

    <section id="previa" hidden>
      <h2 id="previa-nombre"></h2>
      <p id="previa-instrucciones"></p>
      <p>Récord: <span id="previa-record"></span></p>
      <div id="previa-historial"></div>
      <button id="btn-jugar" class="grande color" style="--c: var(--acento)">Jugar</button>
      <button class="btn-menu">Menú</button>
    </section>

    <section id="juego" hidden>
      <div id="tablero"></div>
    </section>

    <section id="final" hidden>
      <h2>Puntuación: <span id="final-puntos"></span></h2>
      <p id="final-record" hidden>¡Nuevo récord!</p>
      <p id="final-entreno" hidden>✓ ¡Entrenamiento de hoy completado!</p>
      <button id="btn-repetir" class="grande color" style="--c: var(--acento)">Repetir</button>
      <button class="btn-menu">Menú</button>
    </section>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
